  _hook_defaults: &defaults
  language: script
  always_run: true
  pass_filenames: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Generated API dumps end with a trailing blank line that `apiCheck`
        # requires; the fixer would strip it and break the check.
        exclude: '\.api$'
  # These need no build, so they run here rather than in the Gradle workflow.
  - repo: local
    hooks:
      - <<: *defaults
        id: check-testdata
        name: check-testdata
        entry: scripts/check-testdata.sh
      - <<: *defaults
        id: script-tests
        name: script-tests
        entry: scripts/tests/run.sh
